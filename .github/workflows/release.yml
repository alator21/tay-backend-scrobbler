# Pushing a tag like v1.2.3 publishes the image to Docker Hub as
# <DOCKERHUB_USERNAME>/tay-backend-scrobbler with tags 1.2.3, 1.2, 1 and latest.
# It also copies README.md to the Docker Hub overview. Needs repository secrets
# DOCKERHUB_USERNAME and DOCKERHUB_TOKEN: an access token with Read, Write,
# Delete scope (updating the description needs more than Read & Write).
name: Release

on:
  push:
    tags: ["v*.*.*"]

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/tay-backend-scrobbler
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Copies README.md to the Docker Hub overview page.
      - uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ secrets.DOCKERHUB_USERNAME }}/tay-backend-scrobbler
          short-description: Scrobbles YouTube Music listening history to Last.fm, from a server
          readme-filepath: ./README.md
          # Turns relative links (compose.yaml, LICENSE) into GitHub links.
          enable-url-completion: true
